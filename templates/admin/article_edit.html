{% extends "admin/base.html" %}

{% block admin_content %}
<h1 class="admin-title">Edit article</h1>
<p class="admin-hint">Public URL: <code>/articles/{{ slug }}</code> — changing the title regenerates the slug.</p>

<form class="admin-card admin-form" method="post" action="/admin/articles/{{ id }}">
  <div class="field">
    <label for="title">Title</label>
    <input id="title" name="title" type="text" required maxlength="300" value="{{ title }}">
  </div>
  <div class="field">
    <label for="banner">Banner (uploaded image)</label>
    <select id="banner" name="banner">
      <option value="">— none —</option>
      {% for option in image_options %}
      <option value="{{ option.url }}" {% if option.url == banner %}selected{% endif %}>{{ option.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="tags">Tags (comma-separated)</label>
    <input id="tags" name="tags" type="text" maxlength="300" value="{{ tags }}">
  </div>
  <div class="field">
    <label for="content">Content (Markdown)</label>
    <textarea id="content" name="content" rows="24" class="mono">{{ content }}</textarea>
  </div>
  <button class="button button-primary" type="submit">Save</button>
  <a class="button button-ghost" href="/admin/articles">Back to list</a>
</form>
{% endblock %}
